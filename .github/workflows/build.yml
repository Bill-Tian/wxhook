name: Build wxhook DLL (x64)

on:
  push:
    branches: [ main, master, wx-3.9.12.57-x64 ]
  pull_request:
    branches: [ main, master, wx-3.9.12.57-x64 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build wxhook.dll (x64)
        run: |
          msbuild wxhook.sln `
            /p:Configuration=${{ matrix.configuration }} `
            /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /m

      - name: Upload Artifact (${{ matrix.configuration }})
        uses: actions/upload-artifact@v4
        with:
          name: wxhook-x64-${{ matrix.configuration }}
          path: |
            x64/${{ matrix.configuration }}/wxhook.dll
            tools/inject_x64.py
            tools/receiver.py
          if-no-files-found: error
